<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #15171c; --muted: #6b7280; --line: #e4e6eb;
    --accent: #2563eb; --accent-soft: #e8efff; --good: #15803d; --good-soft: #e6f5eb;
    --warn: #b45309; --warn-soft: #fdf2e1; --bad: #b91c1c; --bad-soft: #fdecec;
    --mine: #fff7d6; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #171a20; --ink: #e7e9ee; --muted: #98a1b0; --line: #272c36;
      --accent: #6ea0ff; --accent-soft: #1a2640; --good: #4ade80; --good-soft: #13271b;
      --warn: #fbbf24; --warn-soft: #2c230f; --bad: #f87171; --bad-soft: #2f1617;
      --mine: #29250f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--muted); }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }

  /* ---------- sticky top: status + pick entry ---------- */
  .top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 9px 14px 6px; }
  .pickno { font-size: 20px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .pickno small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .otc { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .otc .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .otc .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
  .otc .time.low { color: var(--bad); }
  .mypick { padding: 4px 10px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .mypick.soon { background: var(--warn-soft); color: var(--warn); }
  .mypick.up { background: var(--good); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .72; } }
  .feed { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .entry { display: flex; gap: 8px; padding: 0 14px 9px; position: relative; }
  .entry input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
                 background: var(--bg); color: var(--ink); }
  .entry input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results { position: absolute; left: 14px; right: 14px; top: 36px; z-index: 11; background: var(--panel);
             border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.2); display: none; overflow: hidden; }
  .results.show { display: block; }
  .results div { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .results div.sel, .results div:hover { background: var(--accent-soft); }
  .msg { padding: 0 14px 7px; font-size: 12px; color: var(--muted); }
  .msg:empty { display: none; }
  .msg.err { color: var(--bad); }
  /* pick strip */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scroll-behavior: smooth; }
  .strip:empty { display: none; }
  .card { flex: none; width: 158px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 7px; background: var(--bg); font-size: 12px; }
  .card.past { width: 138px; }
  .card.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--accent); }
  .card.mine { background: var(--mine); border-color: var(--warn); }
  .card .ch { display: flex; gap: 4px; align-items: baseline; color: var(--muted); font-size: 11px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; }
  .card .ch b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .card .ch .tm { overflow: hidden; text-overflow: ellipsis; }
  .card .ln { display: flex; justify-content: space-between; gap: 6px; line-height: 1.5; }
  .card .ln span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ln span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .bl { font-size: 10.5px; color: var(--muted); margin: -1px 0 1px; }
  .card .act { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pg { font-size: 11px; font-weight: 600; }
  .pg.hi { color: var(--good); } .pg.mid { color: var(--warn); } .pg.lo { color: var(--bad); }
  .banner { display: none; padding: 7px 14px; background: var(--bad-soft); color: var(--bad); font-weight: 500; font-size: 13px; }
  .banner.show { display: block; }

  /* ---------- layout: built for half a screen, widens to 3 columns ---------- */
  main { display: grid; gap: 12px; padding: 12px 14px 32px; grid-template-columns: minmax(0, 1fr);
         grid-template-areas: "recs" "teams" "log"; align-items: start; }
  @media (min-width: 1400px) {
    main { grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr); grid-template-areas: "recs teams" "log teams"; }
  }
  @media (max-width: 640px) { main { padding: 10px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .p-recs { grid-area: recs; } .p-teams { grid-area: teams; } .p-log { grid-area: log; }
  .p-log summary { padding: 8px 12px; cursor: pointer; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .head { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head h2 { margin: 0; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: none; background: none; color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  .spin { font-size: 12px; color: var(--accent); }
  .srcs { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .srcs.none { color: var(--bad); font-weight: 600; }
  .empty-note { padding: 14px 12px; color: var(--muted); }

  /* tables */
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 8px 4px; white-space: nowrap; }
  th.num { text-align: right; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  tr.top td { background: var(--good-soft); }
  tr.top td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  .pname { font-weight: 600; }
  .pos { font-size: 11px; color: var(--muted); margin-left: 5px; }
  .vs.neg { color: var(--muted); }
  .bar { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .bar i { display: inline-block; width: 30px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .bar.hi i b { background: var(--good); } .bar.lo i b { background: var(--bad); }
  .bar span { min-width: 34px; text-align: right; }
  td.up { color: var(--good); font-weight: 600; } td.dn { color: var(--bad); }
  .ptag { font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  .ptag.safe { color: var(--good); background: var(--good-soft); border: 1px solid var(--good); }
  .ptag.tgt { color: var(--good); background: var(--good-soft); border: 1px solid var(--good); }
  .ptag.flr { color: var(--accent); background: var(--panel); border: 1px dashed var(--accent); }
  tr.floor td { background: var(--accent-soft); }
  tr.floor td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  tr.top.floor td { background: var(--good-soft); }
  .ptag.fall { color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent); }
  .chg { font-size: 10.5px; font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--good); } .chg.dn { color: var(--bad); }
  .advice.updating { opacity: .55; }
  tr.avl td { padding: 0 8px; border-top: 2px dashed var(--line); font-size: 11px; font-weight: 700; color: var(--muted); }
  tr.avl td span { position: relative; top: -1px; background: var(--panel); padding: 0 6px; }
  tr.avl.half td { border-top-color: var(--warn); color: var(--warn); }
  tr.avl.sure td { border-top-color: var(--good); color: var(--good); }
  tr.avl.floor td { border-top: 2px solid var(--accent); color: var(--accent); }
  .tline { display: flex; flex-wrap: wrap; gap: 3px 18px; align-items: baseline; color: var(--ink); }
  .tline .tgt { font-size: 14.5px; }
  .likely { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .ptag.gamble { color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); }
  .gap { display: inline-block; font-weight: 700; border-radius: 5px; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .gap small { font-weight: 500; opacity: .8; }
  .gap.gup { color: var(--good); background: var(--good-soft); }
  .gap.gdn { color: var(--bad); background: var(--bad-soft); }
  .agr { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .advice { margin: 8px 10px 4px; padding: 8px 11px; border-radius: 8px; font-size: 13px; line-height: 1.45;
            background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .advice.different { background: var(--warn-soft); color: var(--ink); border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
  .advice.close { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
  .advice b { color: var(--ink); }
  .advice ul { margin: 4px 0 0; padding-left: 18px; }
  .add { padding: 0 7px; font-size: 12px; color: var(--muted); }

  /* position chips (in the recommendations header) */
  .posbar { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .chip { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; background: var(--bg); color: var(--muted);
          font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chip.full { background: var(--good-soft); color: var(--good); }
  .chip.over { background: var(--warn-soft); color: var(--warn); }

  /* teams table */
  .teams td { padding: 4px 8px; }
  .teams tr.me td { background: var(--mine); }
  .teams tr.onclock td { background: var(--accent-soft); }
  .teams tr.onclock td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .teams .nm { font-weight: 600; max-width: 170px; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: bottom; }
  .teams .model { font-size: 12px; white-space: nowrap; }
  .acc { font-size: 11.5px; color: var(--muted); }
  .acc b { color: var(--ink); }
  .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none; flex: none; }
  .toggle .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle.on { color: var(--warn); }
  .toggle.on .sw { background: var(--warn); }
  .toggle.on .sw::after { transform: translateX(12px); }

  /* log */
  .tag { font-size: 10px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 4px; margin-left: 5px; }
  .log { font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 10px; color: var(--muted);
         white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<div class="top">
  <div class="status">
    <div class="pickno" id="pickno">Pick –</div>
    <div class="otc"><span class="muted">On the clock</span><span class="who" id="who">–</span><span class="time" id="time"></span></div>
    <div class="mypick" id="mypick">–</div>
    <div class="feed"><span class="dot" id="dot"></span><span id="feedtxt">connecting…</span></div>
  </div>
  <div class="entry">
    <input id="q" placeholder="Record a pick: ESPN rank or player name, then Enter" autocomplete="off">
    <button id="undo" title="Remove the last pick or autodraft switch">Undo</button>
    <div class="results" id="results"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="strip" id="strip"></div>
  <div class="banner" id="banner"></div>
</div>

<main>
  <section class="panel p-recs">
    <div class="head">
      <div class="tabs"><button class="on" data-tab="recs">Recommendations</button><button data-tab="under" id="undertab" hidden title="Players your sources rate well above ESPN: the room will let them slide, so they're targets for later rounds">Sleepers</button></div>
      <span class="srcs" id="srcs"></span>
      <span class="spin" id="spin"></span>
      <div class="posbar" id="posbar" title="Your roster by position, against your targets (your full lineup is in ESPN's My Team)"></div>
    </div>
    <div class="advice" id="advice" hidden></div>
    <div class="tbl" id="tablebody"></div>
  </section>

  <section class="panel p-teams">
    <div class="head"><h2>Teams</h2><span class="acc" id="acc"></span></div>
    <div class="tbl" id="teams"></div>
  </section>

  <details class="panel p-log">
    <summary>Troubleshooting log</summary>
    <div class="log" id="log"></div>
  </details>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = (x) => x == null ? "–" : x <= 0 ? "0%" : x >= 1 ? "100%" : x < 0.01 ? "<1%" : x > 0.99 ? ">99%" : Math.round(x * 100) + "%";
const signed = (x) => (x > 0 ? "+" : "") + (typeof x === "number" ? x.toLocaleString() : x);
let S = null, players = [], playersVersion = -1, tab = "recs", clockAt = 0, sel = 0, lastRender = "", tableKey = "";

function bar(p) {
  if (p == null) return "–";
  const cls = p >= 0.7 ? "hi" : p <= 0.3 ? "lo" : "";
  return `<span class="bar ${cls}"><i><b style="width:${Math.round(p * 100)}%"></b></i><span>${pct(p)}</span></span>`;
}
const agreeTxt = (a) => a ? `<span class="agr" title="${a[0]} of ${a[1]} other sources are on this side of ESPN">${a[0]}/${a[1]}</span>` : "";
// ESPN's projection, yours, and the gap as a coloured pill (hover: each source).
const projHead = `<th class="num" title="ESPN's projection: what the room sees">ESPN</th>
  <th class="num" title="Your combined projection (ESPN + your sources)">Mine</th>
  <th class="num" title="Mine minus ESPN's. Green: your sources like him more than ESPN does. n/m = how many of your other sources agree">Diff</th>`;
const projCells = (x) => {
  const d = x.espn != null ? x.proj - x.espn : null;
  const t = (x.sources || []).map(([n, v]) => n + " " + v.toLocaleString()).join(" · ");
  const pctTxt = d && x.espn ? ` <small>${d > 0 ? "+" : ""}${Math.round(d / x.espn * 100)}%</small>` : "";
  const pill = d == null || Math.abs(d) < 1 ? `<span class="muted">same</span>`
    : `<span class="gap ${d > 0 ? "gup" : "gdn"}">${d > 0 ? "+" : "−"}${Math.abs(d).toLocaleString()}${pctTxt}</span>${agreeTxt(x.agree)}`;
  return `<td class="num muted">${x.espn != null ? x.espn.toLocaleString() : "–"}</td>
    <td class="num"><b>${x.proj.toLocaleString()}</b></td><td class="num" title="${esc(t)}">${pill}</td>`;
};
function gambleWhy(g) {
  if (!g || !g.espn || g.name === g.espn) return "";
  const n = (x) => x.toLocaleString();
  const why = [];
  if (g.g_proj > g.e_proj && g.g_espn <= g.e_espn)
    why.push(`A bet on your sources: they have ${g.name} ${n(g.g_proj)} vs ${g.espn} ${n(g.e_proj)}, ESPN the other way ` +
             `(${n(g.g_espn)} vs ${n(g.e_espn)}). Pays off if your sources are right.`);
  if (g.e_now != null && g.e_now < 0.6 && (g.g_now ?? 1) > g.e_now + 0.15)
    why.push(`Timing: ${g.espn} (ESPN's pick) is only ${pct(g.e_now)} likely to reach your pick, ${g.name} ${pct(g.g_now)}.`);
  if (!why.length) why.push(`Roster fit: ${g.name} adds more to your lineup than ${g.espn} over the rest of the draft.`);
  if (g.e_after != null && g.next_pick && g.e_after >= 0.2) why.push(`${g.espn} is ${pct(g.e_after)} likely still there at #${g.next_pick}.`);
  return `Ends better than ESPN's pick in ${pct(g.p_better)} of simulated drafts (${g.diff >= 0 ? "+" : ""}${g.diff} on average).\n` + why.join("\n");
}
function tagTxt(x, r) {
  let t = "";
  if (x.is_target) t += `<span class="ptag tgt" title="The pick to aim for: best final roster on average, weighing how good he is against his chance of being there">TARGET</span>`;
  if (x.is_floor) t += `<span class="ptag flr" title="Your floor: whatever the teams before you take, you get someone at least this good (by your projections)">FLOOR</span>`;
  if (x.tag === "safe") t += `<span class="ptag safe" title="ESPN's pick: its top projection among players you can realistically get (what ESPN's board and autodraft go by)">ESPN</span>`;
  if (x.tag === "gamble") t += `<span class="ptag gamble" title="${esc(gambleWhy(r && r.advice && r.advice.gamble) || "Ends with a better final roster than ESPN's pick in at least 40% of simulated drafts")}">GAMBLE</span>`;
  if (x.falling) t += `<span class="ptag fall" title="ESPN ranks him well before your pick, but he has a real chance of lasting to you">FALLING</span>`;
  return t;
}
// Divider lines in the board (sorted by your projections). Each line is
// drawn under the first player where the chance that the best player left for
// you at your pick is him or someone better reaches 50% / 90%; the FLOOR is the
// 100% line: whatever the teams before you take, someone above it is there.
function availLine(r, i, cols) {
  if (!S.status.picks_until || !r.recs.length || r.recs[0].p_best_up == null || i === 0) return "";
  const prev = r.recs[i - 1], at = S.status.my_next;
  const crossed = (t) => (prev.p_best_up ?? 0) >= t && (i < 2 || (r.recs[i - 2].p_best_up ?? 0) < t);
  const row = (c, t) => `<tr class="avl ${c}"><td colspan="${cols}"><span>${t}</span></td></tr>`;
  if (prev.is_floor) return row("floor", `100%: you get someone above this line at #${at}`);
  if (crossed(0.9)) return row("sure", `90% chance you get someone above this line at #${at}`);
  if (crossed(0.5)) return row("half", `50% chance you get someone above this line at #${at}`);
  return "";
}
function changeTxt(x) {
  if (x.p_change == null || Math.abs(x.p_change) < 0.05) return "";
  const up = x.p_change > 0;
  return `<span class="chg ${up ? "up" : "dn"}" title="Change in his chance of lasting to your pick since the last pick">${up ? "▲" : "▼"}${Math.round(Math.abs(x.p_change) * 100)}</span>`;
}
function riskTip(x) {
  if (x.p_better == null) return "";
  const same = Math.max(0, 1 - x.p_better - x.p_worse);
  return `Versus ESPN's pick, across simulated drafts:\n` +
    `better in ${pct(x.p_better)}${x.p_better > 0.005 ? ` (avg +${x.avg_up})` : ""}\n` +
    `worse in ${pct(x.p_worse)}${x.p_worse > 0.005 ? ` (avg ${x.avg_down})` : ""}\n` +
    `about the same in ${pct(same)}`;
}
// Hand-entry buttons only matter when the draft-room feed isn't live.
const manual = () => !(S && S.feed.last_message_age != null && S.feed.last_message_age < 20);
const addBtn = (id) => `<button class="add" data-pick="${esc(id)}" title="Record as the next pick">+</button>`;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}

async function refresh() {
  try {
    S = await api("/api/state");
    if (S.version !== playersVersion) { players = await api("/api/players"); playersVersion = S.version; }
    clockAt = performance.now();
    render();
  } catch (e) {
    $("dot").className = "dot bad"; $("feedtxt").textContent = "dashboard not running";
  }
}

function render() {
  const st = S.status;
  $("pickno").innerHTML = st.complete ? "Draft complete" : `Pick ${st.pick}<small>Rd ${st.round}/${st.rounds}</small>`;
  $("who").textContent = st.on_clock ? st.on_clock.name : "–";
  const mp = $("mypick");
  if (st.picks_until === 0) { mp.className = "mypick up"; mp.textContent = "You're on the clock"; }
  else if (st.picks_until != null) {
    mp.className = "mypick" + (st.picks_until <= 2 ? " soon" : "");
    mp.textContent = `You pick #${st.my_next} · ${st.picks_until} away`;
  } else { mp.className = "mypick"; mp.textContent = "Your draft is done"; }

  const f = S.feed;
  const live = f.last_message_age != null && f.last_message_age < 20;
  $("dot").className = "dot" + (f.blocked ? " bad" : live ? " live" : "");
  $("feedtxt").textContent = f.blocked ? "lost track" : live ? "live from draft room" : f.connected ? "draft page connected" : "manual entry";
  const b = $("banner");
  b.className = "banner" + (f.blocked ? " show" : "");
  let missTxt = "";
  if (f.blocked && f.missing && f.missing[1]) {
    const [first, n] = f.missing;
    missTxt = n === 1 ? `Pick #${first} is missing` : `Picks #${first}–#${first + n - 1} are missing`;
  }
  const waiting = f.blocked && (!f.missing || f.missing[1] === 0);
  if (f.team_count) {  // wrong number of teams in the league file: say exactly how to fix it
    const n = f.team_count > 0 ? f.team_count : null;
    const pos = f.my_position ? f.my_position : "<your position>";
    b.className = "banner show";
    b.innerHTML = `This draft has <b>${n ?? "more than " + f.file_teams}</b> teams but ${esc(f.league_file)} has ${f.file_teams}. ` +
      `Close the dashboard (Ctrl+C in the terminal) and run:<br><code>python -m fantasydraft new-league ${esc(f.league_file)} --teams ${n ?? "N"} --my-pick ${pos} --force</code><br>` +
      `then start it again with the same picks file (<code>--picks ${esc(f.picks_file)}</code>); it picks up where it left off.` +
      (n ? "" : " (N = the number of teams in the draft room's pick order.)");
  } else
  b.textContent = !f.blocked ? "" : waiting
    ? "Checking the pick count against the draft page… New picks are held until it matches. " +
      "If this doesn't clear in a few seconds, open the draft room's Pick History."
    : `${missTxt} (the page probably reloaded). Enter ${missTxt.includes("–") ? "them" : "it"} in order in the box above ` +
      `(ESPN rank or name; someone not in your list can be entered by name too); held picks then catch up by themselves. ` +
      `Opening the draft room's Pick History can also fix it.`;

  renderStrip();
  const src = S.sources || [];
  $("srcs").className = "srcs" + (src.length > 1 ? "" : " none");
  $("srcs").textContent = src.length > 1 ? "Mine = " + src.join(" + ") : "Mine = ESPN only (no extra sources loaded)";
  const r = S.result || {};
  $("undertab").hidden = !r.has_sources;
  $("spin").textContent = r.error || (!S.computing ? "" : r.stage === "quick" ? "working out chances…"
    : r.stage === "chances" ? "comparing picks…" : "updating…");
  $("tablebody").style.opacity = r.stale ? "0.55" : "";
  const tkey = JSON.stringify([tab, r, manual(), S.status.my_picks]);
  if (tkey !== tableKey) { tableKey = tkey; renderTable(r); }
  $("advice").hidden = true;  // the table's tags carry the advice now

  // Re-render the slower-changing panels only when their data changed (keeps selects/scroll stable).
  const key = JSON.stringify([S.version, S.teams, S.positions, S.strip.accuracy]);
  if (key !== lastRender) {
    lastRender = key;
    renderChips(); renderTeams();
  }
  const log = $("log");
  const txt = S.log.join("\n");
  if (log.textContent !== txt) { log.textContent = txt; log.scrollTop = log.scrollHeight; }
}

let stripKey = "", stripPick = -1;
function renderStrip() {
  const T = S.strip;
  const key = JSON.stringify(T);
  if (key === stripKey) return;
  stripKey = key;
  const tag = (c) => c.auto ? '<span class="tag">AUTO</span>' : "";
  // Past picks are left out: the ESPN draft room already shows them.
  // Only the picks that matter for your next decision: up to your next pick
  // (if you're on the clock now, up to the one after).
  let html = "";
  const cards = [];
  for (const c of T.upcoming) {
    cards.push(c);
    if (c.mine && !c.now) break;
  }
  for (const c of cards) {
    const head = `<div class="ch"><b>#${c.pick}</b><span class="tm">${c.now ? "ON CLOCK · " : ""}${esc(c.mine ? "YOU" : c.team)}</span>${tag(c)}</div>`;
    const body = c.mine && c.best_left && c.best_left.length && !c.now
      ? `<div class="bl">best left for you:</div>` + c.best_left.map((x) => `<div class="ln"><span>${esc(x.name)}<span class="pos">${esc(x.pos)}</span></span><span>${pct(x.p)}</span></div>`).join("")
      : c.mine && c.rec ? `<div class="act" title="Top recommendation">→ ${esc(c.rec)}</div>`
      : c.likely.map((x) => `<div class="ln"><span>${esc(x.name)}<span class="pos">${esc(x.pos)}</span></span><span>${pct(x.p)}</span></div>`).join("");
    html += `<div class="card${c.now ? " now" : ""}${c.mine ? " mine" : ""}" ${c.now ? 'id="nowcard"' : ""}>${head}${body}</div>`;
  }
  const strip = $("strip");
  strip.innerHTML = html;
  if (S.status.pick !== stripPick) {  // new pick: start the strip at the card on the clock
    stripPick = S.status.pick;
    strip.scrollLeft = 0;
  }
}

function renderChips() {
  const P = S.positions;
  $("posbar").innerHTML = Object.entries(P.targets).map(([pos, n]) => {
    const k = P.filled[pos];
    return `<span class="chip ${k >= n ? "full" : ""}" title="${pos}: ${k} of ${n} target">${pos} ${k}/${n}</span>`;
  }).join("") + (P.over.length ? `<span class="chip over" title="Over target: ${esc(P.over.join(", "))}">+${P.over.length} over</span>` : "");
}

function teamTip(t) {
  const o = t.observed, lines = [];
  if (t.manager) lines.push(t.manager + (t.favorite_team ? ` (${t.favorite_team} fan)` : ""));
  if (t.view && t.view !== "espn") lines.push(`Trusts ${t.view === "mix" ? "ESPN + outside numbers" : "outside numbers"}`);
  lines.push(`${t.count} picked${t.last ? ", last: " + t.last : ""}`);
  if (t.full.length) lines.push(`At target (less likely to take more): ${t.full.join(", ")}`);
  if (o && !t.me) {
    if (o.mix && o.mix.length > 1) lines.push("Modelled as a mix: " + o.mix.map(([s, p]) => `${s} ${Math.round(p * 100)}%`).join(", "));
    if (o.fit) lines.push("Fit to their picks: " + Object.entries(o.fit).map(([k, v]) => `${k} ${Math.round(v * 100)}%`).join(", "));
    if (o.noise != null) lines.push(`Randomness ${o.prior_noise} → ${o.noise.toFixed(2)} (from ${o.picks} own picks)`);
  }
  return lines.join("\n");
}
// What the simulation is using for a team right now (read-only).
function modelTxt(t) {
  if (t.me) return "";
  if (t.auto) return `<b>autodraft</b>`;
  const o = t.observed;
  if (t.strategy !== "unknown") return `<b>${esc(t.strategy)}</b> <span class="muted">(set)</span>`;
  if (o && o.mix && o.mix.length)
    return o.mix.slice(0, 2).map(([k, p], i) => i ? `<span class="muted">${esc(k)} ${Math.round(p * 100)}%</span>`
                                                  : `<b>${esc(k)}</b> ${Math.round(p * 100)}%`).join(" · ");
  return `<span class="muted">adp (no picks yet)</span>`;
}
function renderTeams() {
  const st = S.status, A = S.strip.accuracy;
  $("acc").innerHTML = A ? `<span title="Across ${A.picks} opponent picks: how often the model's most likely player was the one taken">predictions: top guess right <b>${pct(A.top_hit)}</b></span>` : "";
  $("teams").innerHTML = `<table class="teams"><thead><tr><th>Team</th>
      <th class="num" title="Rolling draft score by your combined projections: points of everyone they've taken minus what those pick numbers are normally worth. + = value fell to them; − = reaches">Score</th>
      <th class="num" title="The same score by ESPN's projections (what the room sees). Going off ESPN's board for your own list shows up here as a small minus">ESPN</th>
      <th class="num" title="Projected points of their best starting lineup now (your numbers), ranked among the teams">Starters</th>
      <th title="How the simulation predicts this team right now: autodraft, the strategy that best fits their picks so far (with how sure it is), or one set in your league file. Hover a team for details">Model</th>
      <th title="On autodraft now (ESPN picks by its rank, no randomness). Follows the draft room; click to set by hand">Auto</th></tr></thead><tbody>` +
    S.teams.map((t) => {
      const cls = [t.me ? "me" : "", st.on_clock && st.on_clock.slot === t.slot ? "onclock" : ""].join(" ");
      return `<tr class="${cls}" title="${esc(teamTip(t))}">
        <td><span class="muted">${t.slot + 1}</span> <span class="nm">${esc(t.name)}${t.me ? " (you)" : ""}</span></td>
        <td class="num ${t.score > 0 ? "up" : t.score < 0 ? "dn" : "muted"}">${t.count ? signed(t.score) : "–"}</td>
        <td class="num muted">${t.count ? signed(t.espn_score) : "–"}</td>
        <td class="num">${t.count ? `${t.starters.toLocaleString()} <span class="muted">#${t.starters_rank}</span>` : "–"}</td>
        <td class="model">${modelTxt(t)}</td>
        <td><span class="toggle${t.auto ? " on" : ""}" data-slot="${t.slot}" data-on="${t.auto ? 0 : 1}">${t.auto ? "AUTO" : ""}<span class="sw"></span></span></td>
      </tr>`;
    }).join("") + `</tbody></table>`;
}

function renderTable(r) {
  const body = $("tablebody");
  if (tab === "recs") {
    const cols = (r.has_sources ? 4 : 2) + 3 + (manual() ? 1 : 0);
    if (!r.recs) { body.innerHTML = `<div class="empty-note">Working out recommendations…</div>`; return; }
    if (!r.recs.length) { body.innerHTML = `<div class="empty-note">Nothing to recommend — your draft is done.</div>`; return; }
    body.innerHTML = `<table><thead><tr><th>Player</th>
      ${r.has_sources ? projHead : `<th class="num">Proj</th>`}
      <th class="num" title="Chance the player is still there at your next pick">At my pick</th>
      <th class="num" title="Chance the player lasts to the pick after that, if you pass">Lasts</th>
      <th class="num" title="Final roster value (by your combined numbers) compared with taking ESPN's pick, averaged over simulated drafts. Hover a value for how often it ends better or worse">vs ESPN pick</th>
      ${manual() ? "<th></th>" : ""}</tr></thead><tbody>` +
      r.recs.map((x, i) => availLine(r, i, cols) + `<tr class="${x.is_target ? "top" : ""}${x.is_floor ? " floor" : ""}" ${x.value != null ? `title="Final roster value ${x.value.toLocaleString()}"` : ""}>
        <td><span class="pname">${esc(x.name)}</span><span class="pos">${esc(x.pos)} ${esc(x.team || "")}</span>${tagTxt(x, r)}</td>
        ${r.has_sources ? projCells(x) : `<td class="num">${x.proj.toLocaleString()}</td>`}
        <td class="num">${changeTxt(x)}${bar(x.p_now)}</td><td class="num">${bar(x.p_after)}</td>
        ${x.is_baseline ? `<td class="num muted">ESPN pick</td>`
          : `<td class="num ${x.vs_top > 0 ? "up" : x.vs_top < 0 ? "dn" : "muted"}" title="${esc(riskTip(x))}">${x.vs_top == null ? (r.stage === "full" ? "–" : "…") : (x.vs_top > 0 ? "+" : "") + x.vs_top}</td>`}
        ${manual() ? `<td>${addBtn(x.id)}</td>` : ""}</tr>`).join("") + `</tbody></table>`;
  } else if (tab === "under") {
    const U = r.underrated || [];
    if (!U.length) { body.innerHTML = `<div class="empty-note">No available player that your sources rank well above ESPN.</div>`; return; }
    const mine = S.status.my_picks.slice(0, 2);
    body.innerHTML = `<table><thead><tr><th>Player</th>${projHead}<th class="num" title="How much your sources disagree with each other">±</th>` +
      mine.map((m) => `<th class="num">At #${m}</th>`).join("") + (manual() ? "<th></th>" : "") + `</tr></thead><tbody>` +
      U.map((x) => `<tr title="${esc(x.sources.map(([n, v]) => n + " " + v.toLocaleString()).join(" · "))}">
        <td><span class="pname">${esc(x.name)}</span><span class="pos">${esc(x.pos)} ${esc(x.team || "")}</span></td>
        ${projCells(x)}<td class="num muted">${x.spread}</td>` +
        mine.map((_, k) => `<td class="num">${bar(x.p[k])}</td>`).join("") + (manual() ? `<td>${addBtn(x.id)}</td>` : "") + `</tr>`).join("") + `</tbody></table>`;
  }
}

// countdown between polls
setInterval(() => {
  const el = $("time");
  if (!S || S.status.seconds_left == null || S.status.complete) { el.textContent = ""; return; }
  const left = Math.max(0, S.status.seconds_left - (performance.now() - clockAt) / 1000);
  const s = Math.floor(left);
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  el.className = "time" + (left <= 10 ? " low" : "");
}, 250);

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  if (S) { tableKey = ""; renderTable(S.result || {}); }
});

// ----- actions -----
function showMsg(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }
async function record(id, name) {
  const res = await api("/api/pick", id ? {id} : {name});
  showMsg(res.ok ? res.message.replace(/\s+/g, " ").trim() + " — wrong? Undo" : res.error, !res.ok);
  $("q").value = ""; $("results").className = "results";
  refresh();
}
function matches(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  if (/^\d+$/.test(q)) return players.filter((p) => p.rank === Number(q));
  return players.filter((p) => p.name.toLowerCase().includes(q))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || (a.rank ?? 9999) - (b.rank ?? 9999))
    .slice(0, 8);
}
function drawResults() {
  const list = matches($("q").value), box = $("results");
  sel = Math.min(sel, Math.max(list.length - 1, 0));
  box.innerHTML = list.map((p, i) => `<div class="${i === sel ? "sel" : ""}" data-pick="${esc(p.id)}">
      <span class="pname">${esc(p.name)}</span><span class="pos">${esc(p.pos)} ${esc(p.team || "")}</span>
      <span class="muted" style="margin-left:auto">rank ${p.rank ?? "–"} · ${p.proj}</span></div>`).join("")
    || ($("q").value.trim() && !/^\d+$/.test($("q").value.trim())
        ? `<div data-unlisted="${esc($("q").value.trim())}">No match. Record <b>&nbsp;${esc($("q").value.trim())}&nbsp;</b> as a player not in your list</div>`
        : $("q").value.trim() ? `<div class="muted">No available player with that rank</div>` : "");
  box.className = "results" + (box.innerHTML ? " show" : "");
}
$("q").addEventListener("input", () => { sel = 0; drawResults(); });
$("q").addEventListener("keydown", (e) => {
  const list = matches($("q").value);
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, list.length - 1); drawResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); drawResults(); e.preventDefault(); }
  else if (e.key === "Enter" && list[sel]) record(list[sel].id);
  else if (e.key === "Enter" && !list.length && $("q").value.trim() && !/^\d+$/.test($("q").value.trim())
           && confirm(`Record "${$("q").value.trim()}" as pick #${S.status.pick}? (not in your players list)`)) record(null, $("q").value.trim());
  else if (e.key === "Escape") $("results").className = "results";
});
document.addEventListener("click", (e) => {
  const unl = e.target.closest("[data-unlisted]");
  if (unl) {
    if (confirm(`Record "${unl.dataset.unlisted}" as pick #${S.status.pick}? (not in your players list)`)) record(null, unl.dataset.unlisted);
    return;
  }
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const live = S && S.feed.last_message_age != null && S.feed.last_message_age < 20;
    const p = players.find((x) => x.id === pick.dataset.pick);
    if (live && pick.classList.contains("add") &&
        !confirm(`The draft room feed is live. Record ${p ? p.name : "this player"} as pick #${S.status.pick} by hand anyway?`)) return;
    record(pick.dataset.pick); return;
  }
  const tg = e.target.closest(".toggle");
  if (tg) { api("/api/auto", {slot: Number(tg.dataset.slot), on: tg.dataset.on === "1"}).then(() => { lastRender = ""; refresh(); }); return; }
  if (!e.target.closest(".entry")) $("results").className = "results";
});
$("undo").onclick = async () => {
  const btn = $("undo");
  if (btn.disabled) return;
  if (!manual() && !confirm("The draft room feed is live, so picks come in by themselves. Undo the last entry anyway?")) return;
  btn.disabled = true;
  try {
    const res = await api("/api/undo", {});
    showMsg(res.ok ? res.message : res.error, !res.ok);
    await refresh();
  } finally { setTimeout(() => { btn.disabled = false; }, 800); }
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
