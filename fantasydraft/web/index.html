<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft Board</title>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --ink: #15171c; --muted: #6b7280; --line: #e4e6eb;
    --accent: #2563eb; --accent-soft: #e8efff; --good: #15803d; --good-soft: #e6f5eb;
    --warn: #b45309; --warn-soft: #fdf2e1; --bad: #b91c1c; --bad-soft: #fdecec;
    --mine: #fff7d6; --shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1014; --panel: #171a20; --ink: #e7e9ee; --muted: #98a1b0; --line: #272c36;
      --accent: #6ea0ff; --accent-soft: #1a2640; --good: #4ade80; --good-soft: #13271b;
      --warn: #fbbf24; --warn-soft: #2c230f; --bad: #f87171; --bad-soft: #2f1617;
      --mine: #29250f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html { scrollbar-gutter: stable; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13.5px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .muted { color: var(--muted); }
  button, select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                   border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }

  /* ---------- sticky top: status + pick entry ---------- */
  .top { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); }
  .status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 9px 14px 6px; }
  .pickno { font-size: 20px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  .pickno small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .otc { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .otc .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
  .otc .time { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
  .otc .time.low { color: var(--bad); }
  .mypick { padding: 4px 10px; border-radius: 7px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
  .mypick.soon { background: var(--warn-soft); color: var(--warn); }
  .mypick.up { background: var(--good); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .72; } }
  .feed { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .dot.bad { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
  .entry { display: flex; gap: 8px; padding: 0 14px 9px; position: relative; }
  .entry input { flex: 1; min-width: 0; font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px;
                 background: var(--bg); color: var(--ink); }
  .entry input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .results { position: absolute; left: 14px; right: 14px; top: 36px; z-index: 11; background: var(--panel);
             border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.2); display: none; overflow: hidden; }
  .results.show { display: block; }
  .results div { padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .results div.sel, .results div:hover { background: var(--accent-soft); }
  .msg { padding: 0 14px 7px; font-size: 12px; color: var(--muted); }
  .msg:empty { display: none; }
  .msg.err { color: var(--bad); }
  /* pick strip */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 14px 10px; scroll-behavior: smooth; }
  .strip:empty { display: none; }
  .card { flex: none; width: 158px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px 7px; background: var(--bg); font-size: 12px; }
  .card.past { width: 138px; }
  .card.now { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 3px 0 var(--accent); }
  .card.mine { background: var(--mine); border-color: var(--warn); }
  .card .ch { display: flex; gap: 4px; align-items: baseline; color: var(--muted); font-size: 11px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; }
  .card .ch b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .card .ch .tm { overflow: hidden; text-overflow: ellipsis; }
  .card .ln { display: flex; justify-content: space-between; gap: 6px; line-height: 1.5; }
  .card .ln span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .ln span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .act { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .pg { font-size: 11px; font-weight: 600; }
  .pg.hi { color: var(--good); } .pg.mid { color: var(--warn); } .pg.lo { color: var(--bad); }
  .card.acc { width: 112px; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; justify-content: center; gap: 2px; background: none; }
  .card.acc b { color: var(--ink); font-size: 13px; }
  .banner { display: none; padding: 7px 14px; background: var(--bad-soft); color: var(--bad); font-weight: 500; font-size: 13px; }
  .banner.show { display: block; }

  /* ---------- layout: built for half a screen, widens to 3 columns ---------- */
  main { display: grid; gap: 12px; padding: 12px 14px 32px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
         grid-template-areas: "recs recs" "lineup teams" "recent teams" "log teams"; align-items: start; }
  @media (min-width: 1400px) {
    main { grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr) minmax(0, 1.2fr);
           grid-template-areas: "recs lineup teams" "recs recent teams" "recs log teams"; }
  }
  @media (max-width: 640px) {
    main { grid-template-columns: minmax(0, 1fr); grid-template-areas: "recs" "lineup" "teams" "recent" "log"; padding: 10px; }
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .p-recs { grid-area: recs; } .p-lineup { grid-area: lineup; } .p-teams { grid-area: teams; }
  .p-recent { grid-area: recent; } .p-log { grid-area: log; }
  .head { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head h2 { margin: 0; font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tabs { display: flex; gap: 4px; }
  .tabs button { border: none; background: none; color: var(--muted); font-size: 11.5px; font-weight: 700; text-transform: uppercase;
                 letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; }
  .tabs button.on { background: var(--accent-soft); color: var(--accent); }
  .spin { font-size: 12px; color: var(--accent); }
  .empty-note { padding: 14px 12px; color: var(--muted); }

  /* tables */
  .tbl { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 11px; font-weight: 600; color: var(--muted); text-align: left; padding: 6px 8px 4px; white-space: nowrap; }
  th.num { text-align: right; }
  td { padding: 5px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
  tr.top td { background: var(--good-soft); }
  tr.top td:first-child { box-shadow: inset 3px 0 0 var(--good); }
  .pname { font-weight: 600; }
  .pos { font-size: 11px; color: var(--muted); margin-left: 5px; }
  .vs.neg { color: var(--muted); }
  .bar { display: inline-flex; align-items: center; gap: 5px; justify-content: flex-end; }
  .bar i { display: inline-block; width: 30px; height: 6px; border-radius: 3px; background: var(--line); position: relative; overflow: hidden; }
  .bar i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }
  .bar.hi i b { background: var(--good); } .bar.lo i b { background: var(--bad); }
  .bar span { min-width: 34px; text-align: right; }
  td.up { color: var(--good); font-weight: 600; } td.dn { color: var(--bad); }
  td.risk { font-size: 12px; white-space: nowrap; }
  .ptag { font-size: 10px; font-weight: 800; letter-spacing: .04em; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
  .ptag.safe { color: var(--good); background: var(--good-soft); border: 1px solid var(--good); }
  .ptag.gamble { color: var(--warn); background: var(--warn-soft); border: 1px solid var(--warn); }
  .rk-up { color: var(--good); font-weight: 600; margin-right: 6px; } .rk-dn { color: var(--bad); font-weight: 600; margin-right: 6px; }
  .rk-up small, .rk-dn small { font-weight: 500; }
  .agr { font-size: 10.5px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .advice { margin: 8px 10px 4px; padding: 8px 11px; border-radius: 8px; font-size: 13px; line-height: 1.45;
            background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
  .advice.different { background: var(--warn-soft); color: var(--ink); border-color: var(--warn); box-shadow: inset 4px 0 0 var(--warn); }
  .advice.close { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
  .advice b { color: var(--ink); }
  .advice ul { margin: 4px 0 0; padding-left: 18px; }
  .add { padding: 0 7px; font-size: 12px; color: var(--muted); }
  .suggest { padding: 7px 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
  .suggest b { color: var(--ink); }

  /* lineup */
  .posbar { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .chip { font-size: 11.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: var(--bg); color: var(--muted);
          font-variant-numeric: tabular-nums; }
  .chip.full { background: var(--good-soft); color: var(--good); }
  .chip.over { background: var(--warn-soft); color: var(--warn); }
  .slot { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 8px; padding: 4px 10px; border-top: 1px solid var(--line); align-items: baseline; }
  .slots .slot:first-child { border-top: none; }
  .slot .s { font-size: 11px; font-weight: 700; color: var(--muted); }
  .slot .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .empty { color: var(--muted); font-style: italic; }
  .total { padding: 7px 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-weight: 600; }

  /* teams */
  .team { padding: 8px 10px; border-top: 1px solid var(--line); }
  .team:first-child { border-top: none; }
  .team.me { background: var(--mine); }
  .team.onclock { box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); }
  .trow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .trow .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; width: 16px; flex: none; }
  .trow .nm { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow select { padding: 1px 4px; font-size: 12px; }
  .tsub { margin: 3px 0 0 24px; font-size: 12px; color: var(--muted); }
  .tsub .last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obs { margin: 3px 0 0 24px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 3px 10px; align-items: center; }
  .obs b { color: var(--ink); font-weight: 600; }
  .use { padding: 0 6px; font-size: 11px; color: var(--accent); border-color: var(--accent); }
  .toggle { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); cursor: pointer; user-select: none; flex: none; }
  .toggle .sw { width: 28px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .toggle.on { color: var(--warn); }
  .toggle.on .sw { background: var(--warn); }
  .toggle.on .sw::after { transform: translateX(12px); }

  /* recent + log */
  .recent { max-height: 300px; overflow-y: auto; }
  .rp { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; padding: 4px 10px; border-top: 1px solid var(--line); }
  .rp:first-child { border-top: none; }
  .rp.mine { background: var(--mine); }
  .rp .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .rp .t { font-size: 11.5px; color: var(--muted); }
  .tag { font-size: 10px; font-weight: 700; color: var(--warn); background: var(--warn-soft); border-radius: 4px; padding: 0 4px; margin-left: 5px; }
  .log { font: 11.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 8px 10px; color: var(--muted);
         white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
</style>
</head>
<body>
<div class="top">
  <div class="status">
    <div class="pickno" id="pickno">Pick –</div>
    <div class="otc"><span class="muted">On the clock</span><span class="who" id="who">–</span><span class="time" id="time"></span></div>
    <div class="mypick" id="mypick">–</div>
    <div class="feed"><span class="dot" id="dot"></span><span id="feedtxt">connecting…</span></div>
  </div>
  <div class="entry">
    <input id="q" placeholder="Record a pick: ESPN rank or player name, then Enter" autocomplete="off">
    <button id="undo" title="Remove the last pick or autodraft switch">Undo</button>
    <div class="results" id="results"></div>
  </div>
  <div class="msg" id="msg"></div>
  <div class="strip" id="strip"></div>
  <div class="banner" id="banner"></div>
</div>

<main>
  <section class="panel p-recs">
    <div class="head">
      <div class="tabs"><button class="on" data-tab="recs">Recommendations</button><button data-tab="under" id="undertab" hidden>ESPN underrates</button></div>
      <span class="spin" id="spin"></span>
    </div>
    <div class="advice" id="advice" hidden></div>
    <div class="tbl" id="tablebody"></div>
    <div class="suggest" id="suggest" hidden></div>
  </section>

  <section class="panel p-lineup">
    <div class="head"><h2>Your lineup</h2><span class="muted" id="total"></span></div>
    <div class="posbar" id="posbar"></div>
    <div class="slots" id="lineup"></div>
  </section>

  <section class="panel p-teams">
    <div class="head"><h2>Teams</h2><span class="muted" style="font-size:11.5px">model · autodraft</span></div>
    <div id="teams"></div>
  </section>

  <section class="panel p-recent">
    <div class="head"><h2>Recent picks</h2></div>
    <div class="recent" id="recent"></div>
  </section>

  <section class="panel p-log">
    <div class="head"><h2>Log</h2></div>
    <div class="log" id="log"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = (x) => x == null ? "–" : x <= 0 ? "0%" : x >= 1 ? "100%" : x < 0.01 ? "<1%" : x > 0.99 ? ">99%" : Math.round(x * 100) + "%";
const signed = (x) => (x > 0 ? "+" : "") + x;
const STRATS = {unknown: "Unknown: learn from their picks", adp: "Around ADP", rank: "Follows ESPN rank, loosely", points: "By projected points", balanced: "Balanced builder: best value for their roster, avoids piling up a position", feel: "By feel: picks fairly evenly among ESPN's top ~8"};
let S = null, players = [], playersVersion = -1, tab = "recs", clockAt = 0, sel = 0, lastRender = "";

function bar(p) {
  if (p == null) return "–";
  const cls = p >= 0.7 ? "hi" : p <= 0.3 ? "lo" : "";
  return `<span class="bar ${cls}"><i><b style="width:${Math.round(p * 100)}%"></b></i><span>${pct(p)}</span></span>`;
}
const agreeTxt = (a) => a ? `<span class="agr" title="${a[0]} of ${a[1]} other sources are on this side of ESPN">${a[0]}/${a[1]}</span>` : "";
const vsEspn = (x) => {
  if (x.vs_espn == null || !x.sources || x.sources.length < 2) return '<td class="num muted">–</td>';
  const t = x.sources.map(([n, v]) => n + " " + v.toLocaleString()).join(" · ");
  return `<td class="num ${x.vs_espn > 0 ? "up" : x.vs_espn < 0 ? "dn" : "muted"}" title="${esc(t)}">${x.vs_espn > 0 ? "+" : ""}${x.vs_espn}${agreeTxt(x.agree)}</td>`;
};
function renderAdvice(a) {
  const box = $("advice");
  if (!a) { box.hidden = true; return; }
  box.hidden = false;
  box.className = "advice " + a.kind;
  const g = a.gamble;
  const gl = g ? `<div style="margin-top:4px"><span class="ptag gamble" style="margin:0 6px 0 0">GAMBLE</span><b>${esc(g.name)}</b>:
      ${pct(g.p_better)} chance of a better final roster (avg +${g.avg_up}), ${pct(g.p_worse)} worse (avg ${g.avg_down}).
      Overall ${g.diff >= 0 ? "+" : ""}${g.diff}.</div>` : "";
  if (a.kind === "same") {
    box.innerHTML = `<span class="ptag safe" style="margin:0 6px 0 0">SAFE</span>Top pick at #${a.pick}: <b>${esc(a.top)}</b>, ESPN's top-projected player available.` + gl;
    return;
  }
  const head = a.kind === "close"
    ? `Close call at #${a.pick}: <b>${esc(a.top)}</b> (${a.top_proj.toLocaleString()}) edges out ESPN's top-projected <b>${esc(a.best)}</b> (ESPN ${a.best_proj.toLocaleString()}) by only ${a.gain} pts of final roster value. Either is fine.`
    : `Take <b>${esc(a.top)}</b> (${a.top_proj.toLocaleString()}) over ESPN's top-projected <b>${esc(a.best)}</b> (ESPN ${a.best_proj.toLocaleString()}) at #${a.pick}: about <b>+${a.gain}</b> pts for your final roster.`;
  box.innerHTML = head + `<ul>${a.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>` +
    (g && g.name !== a.top ? gl : "");
}
function tagTxt(x) {
  if (x.tag === "safe") return `<span class="ptag safe" title="Highest ESPN projection available now (what ESPN's board / autodraft would take)">SAFE</span>`;
  if (x.tag === "gamble") return `<span class="ptag gamble" title="Taking this player instead ends with a better final roster in many simulated drafts (see Better / worse)">GAMBLE</span>`;
  return "";
}
function riskTxt(x) {
  if (x.p_better == null) return "–";
  const part = (p, avg, cls, arrow) => p > 0.005 ? `<span class="${cls}">${arrow} ${pct(p)} <small>(${avg > 0 ? "+" : ""}${avg})</small></span>` : "";
  const same = 1 - x.p_better - x.p_worse;
  return [part(x.p_better, x.avg_up, "rk-up", "▲"), part(x.p_worse, x.avg_down, "rk-dn", "▼"),
          same > 0.5 ? `<span class="muted">${pct(same)} same</span>` : ""].filter(Boolean).join(" ") || '<span class="muted">same</span>';
}
const addBtn = (id) => `<button class="add" data-pick="${esc(id)}" title="Record as the next pick">+</button>`;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  return r.json();
}

async function refresh() {
  try {
    S = await api("/api/state");
    if (S.version !== playersVersion) { players = await api("/api/players"); playersVersion = S.version; }
    clockAt = performance.now();
    render();
  } catch (e) {
    $("dot").className = "dot bad"; $("feedtxt").textContent = "dashboard not running";
  }
}

function render() {
  const st = S.status;
  $("pickno").innerHTML = st.complete ? "Draft complete" : `Pick ${st.pick}<small>Rd ${st.round}/${st.rounds}</small>`;
  $("who").textContent = st.on_clock ? st.on_clock.name : "–";
  const mp = $("mypick");
  if (st.picks_until === 0) { mp.className = "mypick up"; mp.textContent = "You're on the clock"; }
  else if (st.picks_until != null) {
    mp.className = "mypick" + (st.picks_until <= 2 ? " soon" : "");
    mp.textContent = `You pick #${st.my_next} · ${st.picks_until} away`;
  } else { mp.className = "mypick"; mp.textContent = "Your draft is done"; }

  const f = S.feed;
  const live = f.last_message_age != null && f.last_message_age < 20;
  $("dot").className = "dot" + (f.blocked ? " bad" : live ? " live" : "");
  $("feedtxt").textContent = f.blocked ? "lost track" : live ? "live from draft room" : f.connected ? "draft page connected" : "manual entry";
  const b = $("banner");
  b.className = "banner" + (f.blocked ? " show" : "");
  let missTxt = "";
  if (f.blocked && f.missing) {
    const [first, n] = f.missing;
    missTxt = n ? (n === 1 ? `Pick #${first} is missing` : `Picks #${first}–#${first + n - 1} are missing`)
                : `Some picks from #${first} on are missing`;
  }
  b.textContent = f.blocked ? `${missTxt || "Lost track of the draft"} (the page probably reloaded). ` +
    `Enter ${missTxt ? "them" : "the missing picks"} in order in the box above (ESPN rank or name); ` +
    `held picks then catch up by themselves. Opening the draft room's Pick History can also fix it.` : "";

  renderStrip();
  const r = S.result || {};
  $("undertab").hidden = !r.has_sources;
  $("spin").textContent = S.computing ? "updating…" : r.error || "";
  $("tablebody").style.opacity = r.stale ? "0.55" : "";
  renderTable(r);
  renderAdvice(r.advice);
  const sg = $("suggest");
  sg.hidden = !S.suggestion;
  if (S.suggestion) sg.innerHTML = `ESPN would autopick for you: <b>${esc(S.suggestion.name)}</b><span class="pos">${esc(S.suggestion.pos)}</span>`;

  // Re-render the slower-changing panels only when their data changed (keeps selects/scroll stable).
  const key = JSON.stringify([S.version, S.lineup, S.bench, S.teams, S.recent.length, S.positions]);
  if (key !== lastRender && !document.activeElement?.matches("select")) {
    lastRender = key;
    renderLineup(); renderTeams(); renderRecent();
  }
  const log = $("log");
  const txt = S.log.join("\n");
  if (log.textContent !== txt) { log.textContent = txt; log.scrollTop = log.scrollHeight; }
}

let stripKey = "", stripPick = -1;
function renderStrip() {
  const T = S.strip;
  const key = JSON.stringify(T);
  if (key === stripKey) return;
  stripKey = key;
  const tag = (c) => c.auto ? '<span class="tag">AUTO</span>' : "";
  // Past picks are left out: the ESPN draft room already shows them.
  let html = "";
  for (const c of T.upcoming) {
    const head = `<div class="ch"><b>#${c.pick}</b><span class="tm">${c.now ? "ON CLOCK · " : ""}${esc(c.mine ? "YOU" : c.team)}</span>${tag(c)}</div>`;
    const body = c.mine && c.rec ? `<div class="act" title="Top recommendation">→ ${esc(c.rec)}</div>`
      : c.likely.map((x) => `<div class="ln"><span>${esc(x.name)}<span class="pos">${esc(x.pos)}</span></span><span>${pct(x.p)}</span></div>`).join("");
    html += `<div class="card${c.now ? " now" : ""}${c.mine ? " mine" : ""}" ${c.now ? 'id="nowcard"' : ""}>${head}${body}</div>`;
  }
  if (T.accuracy) {
    html += `<div class="card acc" title="Across ${T.accuracy.picks} opponent picks: how often the model's most likely player was the one taken, and the average chance it gave the actual pick">
      <span>model's top guess right</span><b>${pct(T.accuracy.top_hit)}</b><span>avg chance of actual ${pct(T.accuracy.avg_p)}</span></div>`;
  }
  const strip = $("strip");
  strip.innerHTML = html;
  if (S.status.pick !== stripPick) {  // new pick: start the strip at the card on the clock
    stripPick = S.status.pick;
    strip.scrollLeft = 0;
  }
}

function renderLineup() {
  const P = S.positions;
  $("posbar").innerHTML = Object.entries(P.targets).map(([pos, n]) => {
    const k = P.filled[pos];
    return `<span class="chip ${k >= n ? "full" : ""}" title="${pos}: ${k} of ${n} target">${pos} ${k}/${n}</span>`;
  }).join("") + (P.over.length ? `<span class="chip over" title="${esc(P.over.join(", "))}">+${P.over.length} over</span>` : "");
  let total = 0, html = "";
  const row = (slot, p) => `<div class="slot"><span class="s">${slot}</span>` +
    (p ? `<span class="p">${esc(p.name)}<span class="pos">${esc(p.pos)}</span></span><span class="num muted">${p.proj}</span>`
       : `<span class="empty">empty</span><span></span>`) + `</div>`;
  for (const s of S.lineup) { if (s.proj) total += s.proj; html += row(s.slot, s.name ? s : null); }
  for (let i = 0; i < Math.max(S.bench_slots, S.bench.length); i++) html += row("BE", S.bench[i]);
  $("lineup").innerHTML = html;
  $("total").textContent = total ? `starters ${total.toLocaleString()}` : "";
}

function renderTeams() {
  const st = S.status;
  $("teams").innerHTML = S.teams.map((t) => {
    const o = t.observed;
    const opts = Object.keys(STRATS).map((k) => `<option value="${k}" ${k === t.strategy ? "selected" : ""} title="${STRATS[k]}">${k}</option>`).join("");
    const learned = o && o.noise != null && !t.me && t.strategy !== "auto";
    const obs = !o ? "" : `<div class="obs">
        <span title="Picks this team made itself (autodraft picks excluded)">${o.picks} own pick${o.picks === 1 ? "" : "s"}</span>
        ${o.best ? `<span title="How well each strategy explains their picks: ${Object.entries(o.fit).map(([k, v]) => k + " " + Math.round(v * 100) + "%").join(", ")}">fits <b>${o.best} ${Math.round(o.best_p * 100)}%</b></span>` : ""}
        ${learned ? `<span title="Randomness learned from their picks (started at ${o.prior_noise}). Lower = more predictable. Used in the simulations.">noise <b>${o.prior_noise}→${o.noise.toFixed(2)}</b></span>` : ""}
        <span title="Average (ADP − pick number). Positive = takes players earlier than ADP">vs ADP <b>${signed(o.vs_adp)}</b></span>
        ${o.suggested && o.suggested !== t.strategy && t.strategy !== "unknown" && !t.me ? `<button class="use" data-slot="${t.slot}" data-strategy="${o.suggested}" title="Model this team as '${o.suggested}'">use ${o.suggested}</button>` : ""}
      </div>`;
    return `<div class="team${t.me ? " me" : ""}${st.on_clock && st.on_clock.slot === t.slot ? " onclock" : ""}">
      <div class="trow"><span class="n">${t.slot + 1}</span><span class="nm" title="${esc(t.name)}">${esc(t.name)}${t.me ? " (you)" : ""}</span>
        ${t.me ? "" : `<select data-slot="${t.slot}" title="How the simulation models this team">${opts}</select>`}
        <span class="toggle${t.auto ? " on" : ""}" data-slot="${t.slot}" data-on="${t.auto ? 0 : 1}" title="On autodraft right now (ESPN picks for them by its rank, no randomness). Follows the draft room automatically; click to set it by hand.">${t.auto ? "AUTO" : "auto"}<span class="sw"></span></span>
      </div>
      ${t.manager || (t.view && t.view !== "espn") || t.favorite_team ? `<div class="tsub">${t.manager ? esc(t.manager) : ""}${t.view && t.view !== "espn" ? ` · trusts <b>${t.view === "mix" ? "ESPN + outside" : "outside research"}</b>` : ""}${t.favorite_team ? ` · ${esc(t.favorite_team)} fan` : ""}</div>` : ""}
      <div class="tsub last">${t.count} picked${t.last ? " · last: " + esc(t.last) : ""}${t.full.length ? ` · <span title="At their position target: the simulation makes them less likely to take more">full: <b>${t.full.join(", ")}</b></span>` : ""}</div>
      ${t.strategy === "unknown" && !t.me && !t.auto ? `<div class="tsub">${o && o.mix && o.mix.length > 1 ? `<span title="Not sure yet: each simulated draft uses one of these, in these proportions. Recent picks count most, so a change of approach shows up within a few picks.">modelled as a mix: ${o.mix.map(([s, p]) => `<b>${s}</b> ${Math.round(p * 100)}%`).join(" · ")}</span>` : o && o.used ? `modelled as <b>${o.used}</b> (best fit so far)` : "modelled as adp until their first pick"}</div>` : ""}${obs}
    </div>`;
  }).join("");
}

function renderRecent() {
  $("recent").innerHTML = S.recent.length ? S.recent.map((p) => `
    <div class="rp${p.mine ? " mine" : ""}"><span class="n">#${p.pick}</span>
      <div><span class="pname">${esc(p.name)}</span><span class="pos">${esc(p.pos)}</span>${p.auto ? '<span class="tag">AUTO</span>' : ""}
      <div class="t">${esc(p.team)}</div></div></div>`).join("") : `<div class="empty-note">No picks yet.</div>`;
}

function renderTable(r) {
  const body = $("tablebody");
  if (tab === "recs") {
    if (!r.recs) { body.innerHTML = `<div class="empty-note">Working out recommendations…</div>`; return; }
    if (!r.recs.length) { body.innerHTML = `<div class="empty-note">Nothing to recommend — your draft is done.</div>`; return; }
    body.innerHTML = `<table><thead><tr><th>Player</th><th class="num">Rank</th><th class="num">Proj</th>
      <th class="num" title="Your consensus projection minus ESPN's (hover a value for each source)">vs ESPN</th>
      <th class="num" title="Chance the player is still there at your next pick">At my pick</th>
      <th class="num" title="Chance the player lasts to the pick after that, if you pass">Lasts</th>
      <th class="num" title="Final roster value (by your consensus numbers) compared with taking ESPN's top-projected player, the SAFE pick (averaged over simulated drafts)">vs SAFE</th>
      <th title="Across the simulated drafts: how often taking this player ends with a better / worse roster than taking the SAFE pick, and by how much on average">Better / worse</th><th></th></tr></thead><tbody>` +
      r.recs.map((x, i) => `<tr class="${i === 0 ? "top" : ""}" title="Final roster value ${x.value.toLocaleString()}">
        <td><span class="pname">${esc(x.name)}</span><span class="pos">${esc(x.pos)} ${esc(x.team || "")}</span>${tagTxt(x)}</td>
        <td class="num muted">${x.rank ?? "–"}</td><td class="num">${x.proj}</td>${vsEspn(x)}
        <td class="num">${bar(x.p_now)}</td><td class="num">${bar(x.p_after)}</td>
        ${x.is_baseline ? `<td class="num muted">baseline</td><td class="muted" style="font-size:12px">ESPN's top projection</td>`
          : `<td class="num ${x.vs_top > 0 ? "up" : x.vs_top < 0 ? "dn" : "muted"}">${x.vs_top == null ? "–" : (x.vs_top > 0 ? "+" : "") + x.vs_top}</td>
             <td class="risk">${riskTxt(x)}</td>`}
        <td>${addBtn(x.id)}</td></tr>`).join("") + `</tbody></table>`;
  } else if (tab === "under") {
    const U = r.underrated || [];
    if (!U.length) { body.innerHTML = `<div class="empty-note">No available player that your sources rank well above ESPN.</div>`; return; }
    const mine = S.status.my_picks.slice(0, 2);
    body.innerHTML = `<table><thead><tr><th>Player</th><th class="num" title="Rank among available players by your consensus">Mine</th><th class="num" title="Rank among available players by ESPN's projection (what the room drafts by)">ESPN</th>
      <th class="num">Consensus</th><th class="num">ESPN proj</th><th class="num" title="How much the sources disagree">±</th>` +
      mine.map((m) => `<th class="num">At #${m}</th>`).join("") + `<th></th></tr></thead><tbody>` +
      U.map((x) => `<tr title="${esc(x.sources.map(([n, v]) => n + " " + v.toLocaleString()).join(" · "))}">
        <td><span class="pname">${esc(x.name)}</span><span class="pos">${esc(x.pos)} ${esc(x.team || "")}</span></td>
        <td class="num"><b>${x.my_rank}</b></td><td class="num muted">${x.espn_rank}</td><td class="num">${x.proj}${agreeTxt(x.agree)}</td>
        <td class="num muted">${x.espn}</td><td class="num muted">${x.spread}</td>` +
        mine.map((_, k) => `<td class="num">${bar(x.p[k])}</td>`).join("") + `<td>${addBtn(x.id)}</td></tr>`).join("") + `</tbody></table>`;
  } else {
    if (!r.available) { body.innerHTML = `<div class="empty-note">Working…</div>`; return; }
    const mine = S.status.my_picks.slice(0, 3);
    body.innerHTML = `<table><thead><tr><th>Player</th><th class="num">Rank</th><th class="num">ADP</th><th class="num">Proj</th><th class="num">vs ESPN</th>` +
      mine.map((m) => `<th class="num">At #${m}</th>`).join("") + `<th></th></tr></thead><tbody>` +
      r.available.map((x) => `<tr><td><span class="pname">${esc(x.name)}</span><span class="pos">${esc(x.pos)} ${esc(x.team || "")}</span></td>
        <td class="num muted">${x.rank ?? "–"}</td><td class="num muted">${x.adp != null ? Math.round(x.adp * 10) / 10 : "–"}</td><td class="num">${x.proj}</td>${vsEspn(x)}` +
        mine.map((_, k) => `<td class="num">${bar(x.p[k])}</td>`).join("") + `<td>${addBtn(x.id)}</td></tr>`).join("") + `</tbody></table>`;
  }
}

// countdown between polls
setInterval(() => {
  const el = $("time");
  if (!S || S.status.seconds_left == null || S.status.complete) { el.textContent = ""; return; }
  const left = Math.max(0, S.status.seconds_left - (performance.now() - clockAt) / 1000);
  const s = Math.floor(left);
  el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  el.className = "time" + (left <= 10 ? " low" : "");
}, 250);

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  if (S) renderTable(S.result || {});
});

// ----- actions -----
function showMsg(text, err) { const m = $("msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }
async function record(id) {
  const res = await api("/api/pick", {id});
  showMsg(res.ok ? res.message.replace(/\s+/g, " ").trim() + " — wrong? Undo" : res.error, !res.ok);
  $("q").value = ""; $("results").className = "results";
  refresh();
}
async function setStrategy(slot, strategy) {
  const res = await api("/api/strategy", {slot, strategy});
  showMsg(res.ok ? res.message : res.error, !res.ok);
  lastRender = ""; refresh();
}
function matches(q) {
  q = q.trim().toLowerCase();
  if (!q) return [];
  if (/^\d+$/.test(q)) return players.filter((p) => p.rank === Number(q));
  return players.filter((p) => p.name.toLowerCase().includes(q))
    .sort((a, b) => (a.name.toLowerCase().startsWith(q) ? 0 : 1) - (b.name.toLowerCase().startsWith(q) ? 0 : 1) || (a.rank ?? 9999) - (b.rank ?? 9999))
    .slice(0, 8);
}
function drawResults() {
  const list = matches($("q").value), box = $("results");
  sel = Math.min(sel, Math.max(list.length - 1, 0));
  box.innerHTML = list.map((p, i) => `<div class="${i === sel ? "sel" : ""}" data-pick="${esc(p.id)}">
      <span class="pname">${esc(p.name)}</span><span class="pos">${esc(p.pos)} ${esc(p.team || "")}</span>
      <span class="muted" style="margin-left:auto">rank ${p.rank ?? "–"} · ${p.proj}</span></div>`).join("")
    || ($("q").value.trim() ? `<div class="muted">No available player matches</div>` : "");
  box.className = "results" + (box.innerHTML ? " show" : "");
}
$("q").addEventListener("input", () => { sel = 0; drawResults(); });
$("q").addEventListener("keydown", (e) => {
  const list = matches($("q").value);
  if (e.key === "ArrowDown") { sel = Math.min(sel + 1, list.length - 1); drawResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { sel = Math.max(sel - 1, 0); drawResults(); e.preventDefault(); }
  else if (e.key === "Enter" && list[sel]) record(list[sel].id);
  else if (e.key === "Escape") $("results").className = "results";
});
document.addEventListener("click", (e) => {
  const pick = e.target.closest("[data-pick]");
  if (pick) {
    const live = S && S.feed.last_message_age != null && S.feed.last_message_age < 20;
    const p = players.find((x) => x.id === pick.dataset.pick);
    if (live && pick.classList.contains("add") &&
        !confirm(`The draft room feed is live. Record ${p ? p.name : "this player"} as pick #${S.status.pick} by hand anyway?`)) return;
    record(pick.dataset.pick); return;
  }
  const use = e.target.closest(".use");
  if (use) { setStrategy(Number(use.dataset.slot), use.dataset.strategy); return; }
  const tg = e.target.closest(".toggle");
  if (tg) { api("/api/auto", {slot: Number(tg.dataset.slot), on: tg.dataset.on === "1"}).then(() => { lastRender = ""; refresh(); }); return; }
  if (!e.target.closest(".entry")) $("results").className = "results";
});
document.addEventListener("change", (e) => {
  if (e.target.matches("select[data-slot]")) setStrategy(Number(e.target.dataset.slot), e.target.value);
});
$("undo").onclick = async () => {
  const res = await api("/api/undo", {});
  showMsg(res.ok ? res.message : res.error, !res.ok);
  refresh();
};

refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
